spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME}
    password:
  jpa:
    hibernate:
      ddl-auto: update
  # JWT 설정 (개발용)
  jwt:
    # 환경 변수가 없으면 기본값을 사용합니다.
    secret: ${JWT_SECRET}
    expiration: 3600 # 1시간
  # 로깅 설정 (개발용)
  logging:
    level:
      com.app.server: WARN
      org.hibernate.SQL: WARN
      org.hibernate.type.descriptor.sql.BasicBinder: WARN
  flyway:
    enabled: true                  # flyway 활성화 여부 (기본 true)
    locations: classpath:db-migration/  # 마이그레이션 SQL 파일 위치
    baseline-on-migrate: true         # 기존 데이터베이스가 있을 때 baseline 생성 여부
    baseline-version: 1               # baseline 시작 버전 (기본 1)
    sql-migration-suffixes: .sql     # migration 파일 확장자 지정 (선택적)
    encoding: UTF-8                  # SQL 파일 인코딩
    clean-disabled: false             # clean 명령 비활성화 여부
# OAuth2 설정 (개발용)
app:
  oauth2:
    authorized-redirect-uris: http://localhost:3000/login/oauth2/redirect
